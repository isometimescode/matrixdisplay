<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>matrixdisplay</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    h1 {
      font-size: 1.25rem;
      text-align: center;
    }
    .animations {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 480px;
      margin: 0 auto;
    }
    button {
      width: 100%;
      font-size: 1.25rem;
      padding: 1.25rem;
      border: none;
      border-radius: 0.5rem;
      background: #2a6f97;
      color: #fff;
      cursor: pointer;
    }
    button:active {
      background: #1c4e6b;
    }
    button.queued {
      background: #2f8f4e;
    }
    button.queued::after {
      content: " ✓";
    }
    .text-form {
      max-width: 480px;
      margin: 0 auto 1.5rem;
      display: flex;
      gap: 0.5rem;
    }
    .text-form input {
      flex: 1;
      font-size: 1.1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: #222;
      color: #eee;
    }
    .text-form button {
      width: auto;
      padding: 0.75rem 1.25rem;
      background: #7a3fa0;
    }
    .text-form button:active {
      background: #55296e;
    }
    .tz-form {
      max-width: 480px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #aaa;
    }
    .tz-form button {
      width: auto;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      background: #444;
    }
    .tz-form button:active {
      background: #333;
    }
    .confirmation {
      max-width: 480px;
      margin: -0.75rem auto 1.5rem;
      text-align: center;
      color: #9fd8b3;
      font-size: 0.9rem;
    }
    hr {
      max-width: 480px;
      margin: 0 auto 1.5rem;
      border: none;
      border-top: 1px solid #333;
    }
    .shutdown-form {
      max-width: 480px;
      margin: 2rem auto 0;
    }
    .shutdown-form button {
      font-size: 1rem;
      padding: 0.75rem;
      background: #7a2020;
    }
    .shutdown-form button:active {
      background: #571616;
    }
  </style>
</head>
<body>
  <h1>Play next...</h1>

  <form class="tz-form" id="tz-form" method="post" action="{{ url_for('update_timezone') }}">
    <span>Clock shows: <strong>{{ current_timezone }}</strong></span>
    <input type="hidden" name="timezone" id="tz-input">
    <button type="submit">Use my time zone</button>
  </form>
  <script>
    document.getElementById('tz-form').addEventListener('submit', function () {
      document.getElementById('tz-input').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
    });
  </script>

  <hr>

  <form class="text-form" method="post" action="{{ url_for('play_text') }}">
    <input type="text" name="text" placeholder="Type a message..." maxlength="{{ max_text_len }}" required autocomplete="off">
    <button type="submit">Send</button>
  </form>
  {% if queued_text %}
  <p class="confirmation">Queued: “{{ queued_text }}”</p>
  {% endif %}

  <hr>

  <div class="animations">
    {% for name in animations %}
    <form method="post" action="{{ url_for('play', name=name) }}">
      <button type="submit" class="{{ 'queued' if name == queued else '' }}">{{ name.replace('_', ' ').title() }}</button>
    </form>
    {% endfor %}
  </div>

  <form
    class="shutdown-form"
    method="post"
    action="{{ url_for('shutdown') }}"
    onsubmit="return confirm('Shut down the display? You will need to unplug and replug power to turn it back on.');"
  >
    <button type="submit">Shut down</button>
  </form>
</body>
</html>
