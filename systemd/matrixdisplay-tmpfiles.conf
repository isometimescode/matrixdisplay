# Install to /etc/tmpfiles.d/matrixdisplay.conf so this runs at every
# boot, before matrixdisplay-daemon.service and matrixdisplay-web.service
# start -- see daemon/inbox.py for why this can't live under /home/pi.
#
# Group is the system `daemon` group, not a custom one: RGBMatrix's
# privilege drop (root -> user `daemon`) is a raw setuid/setgid with no
# initgroups() call, so the demoted process never picks up supplementary
# groups no matter what's added via usermod -- only its primary group
# (daemon) is reliable. `pi` is added to that same group instead.
d /run/matrixdisplay 2770 root daemon -
d /run/matrixdisplay/inbox 2770 root daemon -
